[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cursor-chat-migrate"
version = "1.0.0"
description = "Export and import Cursor IDE chats between machines and accounts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "cursor-chat-migrate" }]
dependencies = []

[project.scripts]
cursor-chat-migrate = "cursor_chat_migrate.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cursor_chat_migrate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
